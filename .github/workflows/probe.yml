name: Probe Transitous
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml", "tools/probe_transitous.mjs", "app/js/transitous.js"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: TZ=Europe/Rome node tools/probe_transitous.mjs || true
      - run: TZ=Europe/Rome UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36" node tools/probe_transitous.mjs
