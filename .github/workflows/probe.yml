name: Probe Transitous
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.transitous.org/api
          curl -sS -m 30 -D - -o geo.json -H "Origin: https://homohabilis.github.io" "$A/v1/geocode?text=Milano%20Centrale&type=STOP" | head -30
          head -c 1500 geo.json; echo
          ID=$(python3 -c "import json;d=json.load(open('geo.json'));print(d[0]['id'])")
          QID=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$ID")
          echo "ID=$ID"
          for v in v5 v4 v1; do
            curl -sS -m 30 -o st.json -w "stoptimes $v: %{http_code}\n" "$A/$v/stoptimes?stopId=$QID&n=40"
            if python3 -c "import json;json.load(open('st.json'))['stopTimes']" 2>/dev/null; then break; fi
          done
          python3 - <<'PY'
          import json
          d = json.load(open('st.json'))
          print(list(d.keys()) if isinstance(d, dict) else type(d))
          for s in d.get('stopTimes', [])[:40]:
              print({k: s.get(k) for k in ('routeShortName', 'displayName', 'headsign', 'tripId', 'agencyName', 'mode', 'tripShortName', 'routeLongName')})
          PY
          head -c 2500 st.json; echo
